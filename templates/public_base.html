<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vacancies{% endblock %} · {{ COMPANY_NAME }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .rm-hero { background: linear-gradient(135deg, #0f2440, #18a0a0); color: #fff; }
    .card { border: 0; box-shadow: 0 1px 3px rgba(15,36,64,.08); }
    .hp { position: absolute; left: -10000px; }
  </style>
</head>
<body>
  <nav class="rm-hero py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="{% url 'vacancies:public_list' %}" class="text-white text-decoration-none fw-bold" style="letter-spacing:.08em">{{ COMPANY_NAME }}</a>
      <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Tenant / staff login</a>
    </div>
  </nav>
  <main class="container py-4">{% block content %}{% endblock %}</main>
</body>
</html>
