{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block public %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #0f2440, #18a0a0);">
  <div class="card p-4" style="width: 380px">
    <h1 class="h4 fw-bold mb-0" style="letter-spacing:.08em">RENTMASTER</h1>
    <p class="text-muted small mb-4">Smart Property &amp; Rental Management</p>
    {% if form.errors %}<div class="alert alert-danger py-2 small">Invalid username or password.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
